<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="favicon.png">
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="173rd Derby Heatherton Scouts News Archive">

    <title>News Archive - 173rd Derby (Heatherton) Scouts</title>

    <link rel="stylesheet" href="/style/style.css">
</head>
<body>

<div id="header"></div>

<section class="welcome">
    <div>
        <h1>News Archive</h1>
        <p>Browse previous news by year.</p>
    </div>
</section>

<section class="archive-layout">

    <div class="archive-column">
        <h2>News Archive</h2>
        <div id="archive"></div>
    </div>

    <div class="archive-column">
        <h2>Previous Events & Photos</h2>

        <ul class="events-list">

            <li>
                <a href="/pages/events/beaversphotos25-26.html">
                    Beavers Photos 2025-26
                </a>
            </li>

        </ul>

    </div>

</section>

<div id="footer"></div>

<div id="fullscreen">
    <span id="closeBtn">&times;</span>
    <img id="fullImg">
</div>

<script src="/style/script.js"></script>

<script>
async function loadPosts() {
    const response = await fetch('pages/news/news.html');
    const html = await response.text();

    const match = html.match(
        /const\s+posts\s*=\s*(\[[\s\S]*?\]);/
    );

    if (!match) {
        console.error("Posts array not found");
        return [];
    }

    return Function(
        `return ${match[1]}`
    )();
}

async function buildArchive() {

    const posts = await loadPosts();

    const archive = document.getElementById("archive");

    if (!archive) return;

    archive.innerHTML = "";

    // Sort newest first
    posts.sort((a, b) => new Date(b.date) - new Date(a.date));

    // Group by year
    const grouped = {};

    posts.forEach(post => {

        const year = new Date(post.date).getFullYear();

        if (!grouped[year]) {
            grouped[year] = [];
        }

        grouped[year].push(post);
    });

    // Create years
    Object.keys(grouped)
        .sort((a, b) => b - a)
        .forEach(year => {

            const yearDiv = document.createElement("div");
            yearDiv.className = "archive-year";

            yearDiv.innerHTML = `
                <div class="year-header">
                    <span class="triangle"></span>
                    <strong>${year}</strong>
                </div>

                <div class="year-content"></div>
            `;

            const yearContent = yearDiv.querySelector(".year-content");

            grouped[year].forEach(post => {

                const postDiv = document.createElement("div");
                postDiv.className = "archive-post";

                postDiv.innerHTML = `
                    <div class="post-header">
                        <span class="triangle"></span>
                        <strong>${post.title}</strong>
                        <span class="date">(${post.date})</span>
                    </div>

                    <div class="post-content">
                        ${post.content}
                    </div>
                `;

                const postHeader = postDiv.querySelector(".post-header");

                // Only one post open at a time
                postHeader.addEventListener("click", () => {

                    const isOpen = postDiv.classList.contains("open");

                    yearContent.querySelectorAll(".archive-post")
                        .forEach(p => p.classList.remove("open"));

                    if (!isOpen) {
                        postDiv.classList.add("open");
                    }

                    initFullscreenImages();
                });

                yearContent.appendChild(postDiv);
            });

            const yearHeader = yearDiv.querySelector(".year-header");

            // Only one year open at a time
            yearHeader.addEventListener("click", () => {

                const isOpen = yearDiv.classList.contains("open");

                document.querySelectorAll(".archive-year")
                    .forEach(y => {
                        y.classList.remove("open");

                        y.querySelectorAll(".archive-post")
                            .forEach(p => p.classList.remove("open"));
                    });

                if (!isOpen) {
                    yearDiv.classList.add("open");
                }
            });

            archive.appendChild(yearDiv);
        });

    initFullscreenImages();
}

buildArchive();
</script>

</body>
</html>
