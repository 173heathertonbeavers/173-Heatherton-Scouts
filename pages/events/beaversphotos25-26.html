<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="favicon.png">
    <base href="/">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Summer Camp 2025 - 173rd Derby (Heatherton) Scouts</title>

    <meta name="description"
          content="Photos from Summer Camp 2025 with 173rd Derby (Heatherton) Scouts.">

    <link rel="stylesheet" href="/style/style.css">

    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;

            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .gallery-photo {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;

            border-radius: 8px;
            cursor: pointer;

            transition: transform 0.2s ease;
        }

        .gallery-photo:hover {
            transform: scale(1.03);
        }

        .album-info {
            text-align: center;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
    </style>
</head>
<body>

<div id="header"></div>

<section class="welcome">
    <div>
        <h1>Beavers Photos 2025-26</h1>
        <p>Photos from our Beaver Colony this year.</p>
    </div>
</section>

<section class="album-info">
    <p>
        This year we have given out 2 Bronze awards
    </p>
</section>

<section>
    <div id="gallery" class="gallery"></div>
</section>

<div id="footer"></div>

<div id="fullscreen">
    <span id="closeBtn">&times;</span>
    <img id="fullImg">
</div>

<script src="/style/script.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    const folder = "images/beavers2526";
    const photoCount = 30;

    let captions = {};

    try {
        const response = await fetch(
            `${folder}/captions.json`
        );

        captions = await response.json();

    } catch (err) {

        console.warn(
            "No captions.json found",
            err
        );
    }

    const gallery = document.getElementById("gallery");

    for (let i = 1; i <= photoCount; i++) {

        const filename = `${i}.jpg`;

        const figure = document.createElement("figure");

        figure.className = "gallery-item";

        figure.innerHTML = `
            <img
                src="${folder}/${filename}"
                alt="${captions[filename] || ""}"
                class="gallery-photo clickable">

            <figcaption>
                ${captions[filename] || ""}
            </figcaption>
        `;

        gallery.appendChild(figure);
    }

    initFullscreenImages();
});
</script>

</body>
</html>
